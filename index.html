<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Dashboard</title>
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0b0f1a;color:#e8ecf4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:16px 14px 40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin-bottom:14px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px;margin-bottom:12px}
.label{font-size:11px;color:#8a93a6;text-transform:uppercase;letter-spacing:1px}
.big{font-size:26px;font-weight:700;margin-top:4px}
.status{font-size:12px;color:#8a93a6;margin-top:6px}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#e8ecf4;padding:12px;border-radius:12px;font-size:15px;outline:none}
button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#e8ecf4;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
button:active{transform:scale(.96)}
.coin{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;margin-bottom:8px}
.coin img{width:34px;height:34px;border-radius:50%;background:#1a2240;flex-shrink:0}
.info{flex:1;min-width:0}
.nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sy{font-size:12px;color:#8a93a6;text-transform:uppercase}
.spark{width:60px;height:28px;flex-shrink:0}
.rt{text-align:right;flex-shrink:0}
.pr{font-size:15px;font-weight:600}
.ch{font-size:12px;font-weight:600}
.up{color:#22c55e}.down{color:#ef4444}
.msg{text-align:center;padding:36px 18px;color:#8a93a6;font-size:14px;line-height:1.6}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;border-radius:14px;padding:14px;font-size:13px;line-height:1.6}
.foot{text-align:center;color:#8a93a6;font-size:11px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💎 Crypto Dashboard</h1>

  <div class="card">
    <div class="label">Total Market Cap (Top 50)</div>
    <div class="big" id="mcap">—</div>
    <div class="status" id="status">Starting up…</div>
  </div>

  <div class="row">
    <input id="search" type="text" placeholder="Search coins…" autocomplete="off">
    <button id="refresh">Refresh</button>
  </div>

  <div id="list"><div class="msg">Loading coins…</div></div>

  <div class="foot">Data from CoinGecko · Refreshes every 60s</div>
</div>

<script>
var coins = [];
var query = '';

function el(id){ return document.getElementById(id); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function money(n){
  if (n === null || n === undefined) return '—';
  var digits = n >= 1 ? 2 : 6;
  return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:digits});
}

function compact(n){
  if (!n) return '—';
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
  return '$' + Number(n).toLocaleString('en-US');
}

function spark(prices, up){
  if (!prices || prices.length < 2) return '<div class="spark"></div>';
  var w = 100, h = 32;
  var min = Math.min.apply(null, prices);
  var max = Math.max.apply(null, prices);
  var range = (max - min) || 1;
  var pts = [];
  for (var i = 0; i < prices.length; i++){
    var x = (i / (prices.length - 1)) * w;
    var y = h - ((prices[i] - min) / range) * h;
    pts.push(x.toFixed(2) + ',' + y.toFixed(2));
  }
  var color = up ? '#22c55e' : '#ef4444';
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
         '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color +
         '" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
}

function render(){
  var list = coins;
  if (query){
    var q = query.toLowerCase();
    list = coins.filter(function(c){
      return c.name.toLowerCase().indexOf(q) > -1 || c.symbol.toLowerCase().indexOf(q) > -1;
    });
  }

  if (!list.length){
    el('list').innerHTML = '<div class="msg">No coins match your search.</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < list.length; i++){
    var c = list[i];
    var ch = c.price_change_percentage_24h || 0;
    var up = ch >= 0;
    var prices = c.sparkline_in_7d && c.sparkline_in_7d.price ? c.sparkline_in_7d.price : null;

    html += '<div class="coin">' +
      '<img src="' + esc(c.image) + '" alt="" loading="lazy">' +
      '<div class="info">' +
        '<div class="nm">' + esc(c.name) + '</div>' +
        '<div class="sy">' + esc(c.symbol) + ' · #' + (c.market_cap_rank || '—') + '</div>' +
      '</div>' +
      spark(prices, up) +
      '<div class="rt">' +
        '<div class="pr">' + money(c.current_price) + '</div>' +
        '<div class="ch ' + (up ? 'up' : 'down') + '">' + (up ? '▲' : '▼') + ' ' + Math.abs(ch).toFixed(2) + '%</div>' +
      '</div>' +
    '</div>';
  }
  el('list').innerHTML = html;
}

function load(){
  el('status').textContent = 'Updating…';

  var url = 'https://api.coingecko.com/api/v3/coins/markets' +
            '?vs_currency=usd&order=market_cap_desc&per_page=50&page=1' +
            '&sparkline=true&price_change_percentage=24h';

  fetch(url)
    .then(function(res){
      if (!res.ok) throw new Error('Server returned ' + res.status);
      return res.json();
    })
    .then(function(data){
      if (!Array.isArray(data)) throw new Error('Unexpected response format');
      coins = data;

      var total = 0;
      for (var i = 0; i < coins.length; i++) total += (coins[i].market_cap || 0);
      el('mcap').textContent = compact(total);

      el('status').textContent = 'Updated ' + new Date().toLocaleTimeString();
      render();
    })
    .catch(function(err){
      el('status').textContent = 'Update failed';
      if (!coins.length){
        el('list').innerHTML = '<div class="err"><strong>Could not load prices.</strong><br>' +
          esc(err.message) + '<br><br>This is usually a temporary rate limit from CoinGecko. ' +
          'Wait 60 seconds and tap Refresh.</div>';
      }
    });
}

el('refresh').addEventListener('click', load);
el('search').addEventListener('input', function(e){
  query = e.target.value.trim();
  render();
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
